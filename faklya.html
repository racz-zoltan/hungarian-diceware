<style>
html,body{margin:0}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --page:#060a17; --text:#e2e8f0; --muted:#94a3b8; --surface:rgba(255,255,255,.04); --surface2:rgba(255,255,255,.07);
  --border:rgba(148,163,184,.16); --hero:#22d3ee; --mon:#fb7185; --gold:#fbbf24; --violet:#a78bfa; --green:#4ade80;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.page{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.kk{position:relative;padding:18px;border-radius:18px;
  background:radial-gradient(900px 500px at 0% -10%,rgba(34,211,238,.13),transparent 60%),radial-gradient(800px 500px at 110% 110%,rgba(251,113,133,.13),transparent 60%),linear-gradient(160deg,#121b35 0%,#0a0f1f 100%);
  box-shadow:0 24px 48px -24px rgba(2,6,23,.7)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1;margin:0;letter-spacing:-.02em}
h1 .x{color:var(--hero)} h1 .o{color:var(--mon)}
h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.btn{font:700 14px var(--f-body);color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px}
.btn:hover{border-color:rgba(148,163,184,.4)}
.btn.primary{background:var(--hero);border-color:var(--hero);color:#04202a}
.btn.danger{border-color:rgba(251,113,133,.6);color:#fecdd3}
.btn.gold{border-color:rgba(251,191,36,.6);color:#fde7a6}
.btn.violet{border-color:rgba(167,139,250,.55);color:#ddd3ff}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{font:600 14px var(--f-body);color:var(--muted);background:transparent;border:0;padding:9px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{color:var(--text);background:rgba(34,211,238,.10);box-shadow:inset 0 -2px 0 var(--hero)}
.chip{font:700 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:3px 6px;white-space:nowrap;display:inline-block}
.chip.gold{color:#1c1300;background:var(--gold)} .chip.violet{color:#160c33;background:var(--violet)}
.chip.cyan{color:#03232b;background:var(--hero)} .chip.rose{color:#2b060d;background:var(--mon)}
.chip.plain{color:var(--muted);border:1px solid var(--border)}

/* Az utolsó fáklya (korábban Kazamata Kommandó) v3 – aszinkron motor + gépi játékos.

    app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; save(); renderSetup(); });

  /* ---------- indítás ---------- */
  function startGame() {

    let o;

      const miss = S.seats.filter((s, i) => s.remote && !peerOk(i)); if (miss.length) { toast('Még nem csatlakozott: ' + miss.map(s => s.name).join(', ') + '. Készíts nekik meghívó kódot, vagy állítsd őket botra.', 3600); return; }

    }
    const st = K.createGame(o);
    if (st.solo) st.heroes.forEach(h => h.name = K.CLS[h.cls].name);
    G.st = st; G.ai = K.makeAI(); G.token++; G.ui = null;
    if (st.heroes.some(h => h.remote)) NET.role = 'host';
    st.onFaint = (h, why, lost) => { if (G.st !== st) return; hostEventAll('faint', { h: h.i, why, lost }); faintDialog(h, why, lost); };
    const humans = st.heroes.filter(isLocal).map(h => h.owner);
    G.multiHuman = false;
    G.viewer = humans.length ? humans[0] : -1;
    const tok = G.token;
    renderGame();
    (async () => {
      await showMissions();
      const res = await K.run(st, controller());
      if (tok !== G.token) return;
      renderGame(); hostEventAll('end', { res }); showEnd(res);
    })().catch(e => { console.error(e); toast('Hiba: ' + e.message); });
  }
  const speedMs = () => ({ slow: 900, normal: 450, fast: 120 }[S.speed] || 450);
  const viewerKnows = z => G.st.zones[z].revealed || G.st.heroes.some(h => h.owner === G.viewer && h.human && h.known[z]);

  /* =====================================================================
   * BARÁTOK SAJÁT TELEFONON: közös Wi-Fi, szerver nélkül (WebRTC + kódcsere)
   * A házigazda telefonja futtatja a játékot; minden barát egy külön
   * kapcsolaton át kapja az állást, és a saját döntéseit küldi vissza.
   * ===================================================================== */
  const rtcOk = typeof RTCPeerConnection !== 'undefined';
  const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  function packDesc(sdp, type, sid) {
    const get = re => { const m = sdp.match(re); return m ? m[1] : ''; };
    const ufrag = get(/a=ice-ufrag:(\S+)/), pwd = get(/a=ice-pwd:(\S+)/), mid = get(/a=mid:(\S+)/) || '0', setup = get(/a=setup:(\S+)/) || 'actpass';
    const fpm = sdp.match(/a=fingerprint:(\S+) ([0-9A-Fa-f:]+)/);
    const alg = fpm ? fpm[1].toLowerCase() : 'sha-256', fp = fpm ? b64u(fpm[2].split(':').map(h => parseInt(h, 16))) : '';
    const cands = [];
    for (const m of sdp.matchAll(/a=candidate:(\S+) 1 (udp|UDP) (\d+) (\S+) (\d+) typ (host|srflx)/g)) cands.push([m[4], m[5], m[3], m[1]].join(','));
    const code = { actpass: 'x', active: 'a', passive: 'p' }[setup] || 'x';
    return ['1', type === 'offer' ? 'o' : 'a', sid, mid, code, ufrag, pwd, alg === 'sha-256' ? '' : alg, fp, cands.slice(0, 4).join('|')].join('~');
  }
  function unpackDesc(str) {
    const f = str.split('~');
    if (f[0] !== '1' || f.length < 10) throw new Error('rossz formátum');
    const [, t, sid, mid, code, ufrag, pwd, alg, fp, cs] = f;
    const hex = Array.from(unb64u(fp), x => x.toString(16).toUpperCase().padStart(2, '0')).join(':');
    const setup = { x: 'actpass', a: 'active', p: 'passive' }[code] || 'actpass';
    const lines = ['v=0', `o=- ${Date.now()}${Math.floor(Math.random() * 1e6)} 2 IN IP4 127.0.0.1`, 's=-', 't=0 0', `a=group:BUNDLE ${mid}`, 'a=msid-semantic: WMS',
      'm=application 9 UDP/DTLS/SCTP webrtc-datachannel', 'c=IN IP4 0.0.0.0'];

    lines.push(`a=ice-ufrag:${ufrag}`, `a=ice-pwd:${pwd}`, 'a=ice-options:trickle', `a=fingerprint:${alg || 'sha-256'} ${hex}`, `a=setup:${setup}`, `a=mid:${mid}`, 'a=sctp-port:5000', 'a=max-message-size:262144');

  }

  const isLocal = h => h.human && !h.remote;
  const peerOk = i => { const p = NET.peers[i]; return !!(p && p.connected && p.dc && p.dc.readyState === 'open'); };
  function sendRaw(dc, m) { try { if (dc && dc.readyState === 'open') { dc.send(typeof m === 'string' ? m : JSON.stringify(m)); return true; } } catch (_) { } return false; }

  /* ----- állás és hivatkozások átvitele ----- */
  function snap() { const st = G.st; if (!st) return null; const c = Object.assign({}, st, { log: st.log.slice(-150), onFaint: undefined }); return JSON.parse(JSON.stringify(c)); }
  function ser(v) {
    const H = G.st ? G.st.heroes : [];
    const walk = x => { if (x && typeof x === 'object') { const k = H.indexOf(x); if (k >= 0) return { $h: k }; if (Array.isArray(x)) return x.map(walk); const o = {}; for (const key in x) o[key] = walk(x[key]); return o; } return x; };

  }

    const walk = x => { if (x && typeof x === 'object') { if (x.$h != null && Object.keys(x).length === 1) return G.st.heroes[x.$h]; if (Array.isArray(x)) return x.map(walk); const o = {}; for (const key in x) o[key] = walk(x[key]); return o; } return x; };

  }

  /* ----- házigazda ----- */
  function hostSend(i, m) { const p = NET.peers[i]; return p ? sendRaw(p.dc, m) : false; }
  function hostBroadcast(m) { const s = JSON.stringify(m); for (const i in NET.peers) hostSend(i, s); }
  const remoteSeats = () => S.mode === 'multi' ? S.seats.map((s, i) => s.remote ? i : -1).filter(i => i >= 0) : [];
  function hostSeatInfo(i) { const s = S.seats[i]; return { t: 'seat', i, name: s.name, cls: s.cls, n: S.seats.length, level: LEVELS[S.level][0], traitor: !!(S.traitor && S.seats.length >= 3) }; }
  function hostSyncSeats() { for (const i in NET.peers) { if (!S.seats[i] || !S.seats[i].remote || S.mode !== 'multi') { hostDrop(+i, true); continue; } if (peerOk(i)) hostSend(i, hostSeatInfo(+i)); } }
  function hostDrop(i, bye) {

  }
  async function hostInvite(i) {
    hostDrop(i);
    const p = NET.peers[i] = { sid: Math.random().toString(36).slice(2, 8), offerCode: '', connected: false, applied: false, note: '', fail: '' };
    p.pc = newPC(t => { p.fail = t; renderNetBox(); });

  async function hostAnswer(i, packed) {

    if (o.sid !== p.sid) { p.note = 'Ez a válaszkód egy másik meghívóhoz tartozik. Lehet, hogy egy másik hős helyére illesztetted be, vagy közben új meghívót készítettél.'; renderNetBox(); return; }

    p.note = 'Kapcsolódás…'; renderNetBox();

  }
  function hostBindDC(i, p, dc) {
    p.dc = dc;

      const h = G.st && G.st.heroes[i];
      if (h && h.remote && !G.st.over) { h.remote = false; h.human = false; toast(h.name + ' kapcsolata megszakadt, egy bot viszi tovább a hősét.', 3200); renderGame(); }

  }
  function hostMsg(i, m) {
    if (m.t === 'hello') {

      const st = G.st; if (!st || st.over || !st.R.traitor || st.accused || st.pendingAccuse) return;
      if (st.heroes[i] && st.heroes[i].remote && st.heroes[m.target] && m.target !== i) { st.pendingAccuse = { by: i, target: m.target }; renderGame(); }
    } else if (m.t === 'bye') { hostDrop(i); renderNetBox(); }
  }
  function failPending(i) { for (const id in NET.pending) if (NET.pending[id].seat === +i) { const r = NET.pending[id]; delete NET.pending[id]; r.reject(new Error('lekapcsolódott')); } }
  function rpc(h, m, args) {
    return new Promise((resolve, reject) => {
      if (!peerOk(h.owner)) return reject(new Error('nincs kapcsolat'));
      const id = ++NET.rpcId; NET.pending[id] = { resolve, reject, seat: h.owner };
      hostSend(h.owner, { t: 'rpc', id, m, args: ser(args), st: snap() });
    });
  }
  // a távoli hős döntése; ha a barát közben lekapcsolódik, egy bot dönt helyette
  function remote(h, m, args, fallback) {
    return rpc(h, m, args).catch(() => { if (h.remote) { h.remote = false; h.human = false; toast(h.name + ' kapcsolata megszakadt, egy bot viszi tovább a hősét.', 3200); } return fallback(); });
  }
  function hostEvent(i, k, extra) { hostSend(i, Object.assign({ t: 'ev', k, st: snap() }, extra || {})); }
  function hostEventAll(k, extra) { if (NET.role !== 'host' || !G.st) return; for (const h of G.st.heroes) if (h.remote) hostEvent(h.owner, k, extra); }
  function hostPushState() {
    if (NET.role !== 'host' || !G.st || !Object.keys(NET.peers).length) return;
    clearTimeout(NET.stTimer);
    NET.stTimer = setTimeout(() => { if (G.st) hostBroadcast({ t: 'state', st: snap() }); }, 60);
  }

  /* ----- barát (vendég) ----- */
  function guestReset() {
    const g = NET.guest; if (g) { clearTimeout(g.timer); clearInterval(g.beat); g.closing = true; try { g.dc && g.dc.close(); } catch (_) { } try { g.pc && g.pc.close(); } catch (_) { } }
    NET.guest = { pc: null, dc: null, sid: null, answerCode: '', connected: false, seat: null, info: null, note: '', fail: '', waiting: false };
  }
  function guestOpen() { NET.role = 'guest'; guestReset(); G.st = null; G.ui = null; G.token++; renderGuest(); }
  function guestLeave() { const g = NET.guest; if (g && g.connected) sendRaw(g.dc, { t: 'bye' }); guestReset(); NET.role = null; NET.guest = null; G.st = null; G.ui = null; G.token++; document.body.classList.remove('darkround'); renderSetup(); }
  async function guestJoin(packed) {
    guestReset(); const g = NET.guest; g.waiting = true;
    let o; try { o = unpackDesc(packed); } catch (e) { g.fail = 'Ez a meghívó kód nem olvasható. Kérj újat a házigazdától.'; renderGuest(); return; }
    if (o.type !== 'offer') { g.fail = 'Ez egy válaszkód, nem meghívó. A meghívó kódot a házigazda készíti.'; renderGuest(); return; }
    g.sid = o.sid;
    g.pc = newPC(t => { g.fail = t; renderGuest(); });
    g.pc.ondatachannel = e => guestBindDC(g, e.channel);
    renderGuest();
    await g.pc.setRemoteDescription({ type: 'offer', sdp: o.sdp });
    await g.pc.setLocalDescription(await g.pc.createAnswer());
    await waitIce(g.pc);
    if (NET.guest !== g) return;
    g.answerCode = toCode(packDesc(g.pc.localDescription.sdp, 'answer', g.sid));
    renderGuest();
    g.timer = setTimeout(() => { if (!g.connected) { g.note = 'Még nem kapcsolódtatok. Küldd el a válaszkódot a házigazdának, és ő illessze be a saját telefonján, a hősöd sorában.'; renderGuest(); } }, 60000);
  }
  function guestBindDC(g, dc) {
    g.dc = dc;
    dc.onopen = () => { g.connected = true; g.seen = Date.now(); g.note = ''; g.fail = ''; clearTimeout(g.timer); sendRaw(dc, { t: 'hello', name: store.get('guestName', '') }); renderGuest(); vib(40); };
    dc.onclose = () => guestLost(g);
    g.pc.addEventListener('connectionstatechange', () => { const cs = g.pc.connectionState; if (cs === 'failed' || cs === 'closed') guestLost(g); });
    g.beat = setInterval(() => { if (g.connected && g.seen && Date.now() - g.seen > 15000) guestLost(g); }, 4000);
    dc.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } g.seen = Date.now(); if (m.t === 'ping') { sendRaw(dc, { t: 'pong' }); return; } NET.q = NET.q.then(() => guestMsg(g, m)).catch(err => console.error(err)); };
  }
  function guestLost(g) {
      if (g.closing || NET.guest !== g || g.lost) return;
      g.lost = true; clearInterval(g.beat); try { g.dc && g.dc.close(); } catch (_) { } try { g.pc && g.pc.close(); } catch (_) { }
      g.connected = false; g.answerCode = ''; g.fail = 'Megszakadt a kapcsolat a házigazdával. Kérj tőle új meghívó kódot.';
      G.st = null; G.ui = null; G.token++; $('#ov').hidden = true; document.body.classList.remove('darkround'); renderGuest();
  }
  function hydrate(s) {
    if (!s) return;
    const g = NET.guest;
    for (const h of s.heroes) h.remote = h.human && h.owner !== g.seat; // a többi ember a saját telefonján dönt
    if (s.R && s.R.cryBoss != null) { K.CARDS['Csatakiáltás'].boss = s.R.cryBoss; K.CARDS['Csatakiáltás'].d = 'A Mélység Ura +' + s.R.cryBoss; }
    G.st = s; G.viewer = g.seat; G.multiHuman = false;
  }
  async function guestMsg(g, m) {
    if (NET.guest !== g) return;
    if (m.t === 'seat') { g.seat = m.i; g.info = m; const nm = store.get('guestName', ''); if (nm && nm.slice(0, 14) !== m.name && !g.nameSent) { g.nameSent = true; sendRaw(g.dc, { t: 'hello', name: nm }); } if (!G.st) renderGuest(); return; }
    if (m.t === 'state') { hydrate(m.st); renderGame(); return; }
    if (m.t === 'rpc') {
      hydrate(m.st); G.ui = null; renderGame(); vib(30);
      const args = deser(m.args);
      const v = await HUMAN[m.m](G.st, ...args);
      sendRaw(g.dc, { t: 'reply', id: m.id, v: ser(v) });
      G.ui = null; renderGame(); return;
    }
    if (m.t === 'ev') {
      if (m.st) { hydrate(m.st); renderGame(); }
      const me = G.st && G.st.heroes[g.seat];
      if (m.k === 'missions' && me) await ask('A titkos küldetésed', missionHtml(me) + (G.st.R.traitor ? '<p class="note">Az áruló-szabály be van kapcsolva.</p>' : ''), [{ l: 'Indulás', v: true, k: 'primary' }]);
      else if (m.k === 'fight') await showFight(m.F);
      else if (m.k === 'faint') await faintDialog(G.st.heroes[m.h], m.why, m.lost);
      else if (m.k === 'flash') flashDungeon(m.msg);
      else if (m.k === 'dark') await darkDialog();
      else if (m.k === 'end') { await showEnd(m.res); }
      return;
    }
    if (m.t === 'lobby') { G.st = null; G.ui = null; $('#ov').hidden = true; document.body.classList.remove('darkround'); g.note = m.msg || ''; renderGuest(); return; }
    if (m.t === 'bye') { g.closing = true; g.connected = false; g.fail = 'A házigazda bontotta a kapcsolatot.'; G.st = null; G.ui = null; $('#ov').hidden = true; renderGuest(); }
  }
  const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) { } };

  /* ----- kódok küldése, másolása, beillesztése ----- */
  async function shareCode(code, intro, noteFn) {
    try { if (navigator.share) { await navigator.share({ text: intro + '\n\n' + code }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    copyCode(code, noteFn);
  }
  async function copyCode(code, noteFn) {
    try { await navigator.clipboard.writeText(code); noteFn('A kódot a vágólapra másoltam, most küldd el.'); }
    catch (_) { noteFn('Jelöld ki és másold ki a kódot.'); }
  }
  async function pasteInto(t, noteFn) {
    try { const v = await navigator.clipboard.readText(); if (v) { t.value = v; t.dispatchEvent(new Event('input')); return; } } catch (_) { }
    t.focus(); noteFn('Tartsd lenyomva a mezőt, és válaszd a Beillesztés lehetőséget.');
  }
  const codeBox = (code, label, id) => `<textarea class="code" readonly rows="3" aria-label="${label}" data-code="${id}">${code}</textarea>
      <div class="row"><button class="btn primary small" data-share="${id}">Küldés</button><button class="btn small" data-copy="${id}">Másolás</button></div>`;
  const pasteBox = (label, id) => `<label class="lbl" for="paste-${id}">${label}</label>
      <textarea id="paste-${id}" class="code" rows="3" placeholder="UF1-…" autocomplete="off" autocapitalize="off" spellcheck="false" data-paste="${id}"></textarea>
      <div class="row"><button class="btn small" data-pastebtn="${id}">Beillesztés</button></div>`;
  function keepPastes(box, fn) {
    const vals = {}; box.querySelectorAll('[data-paste]').forEach(t => vals[t.dataset.paste] = t.value);
    fn(); box.querySelectorAll('[data-paste]').forEach(t => { if (vals[t.dataset.paste]) t.value = vals[t.dataset.paste]; });
  }

  /* ----- házigazda: csatlakozási doboz a beállításoknál ----- */

        ${p && p.connected ? '<span class="chip cyan">csatlakozott</span>' : p && p.applied ? '<span class="chip gold">kapcsolódás…</span>' : '<span class="chip plain">nincs csatlakozva</span>'}</div>`;

      else if (!p || p.fail) h += `<div class="row"><button class="btn small primary" data-invite="${i}" ${rtcOk ? '' : 'disabled'}>Meghívó kód készítése</button></div>`;
      else if (!p.offerCode) h += '<p class="dmsg">Meghívó kód készítése…</p>';
      else if (!p.applied) h += `<p class="dmsg"><b>1.</b> Küldd el ezt a meghívó kódot ennek a barátnak:</p>${codeBox(p.offerCode, 'Meghívó kód', 'h' + i)}
          <p class="dmsg"><b>2.</b> Ő beilleszti, és visszaküld egy válaszkódot. Azt illeszd be ide:</p>${pasteBox('A barát válaszkódja', 'h' + i)}
          <div class="row"><button class="btn small" data-drop="${i}">Mégse</button></div>`;

    box.querySelectorAll('[data-invite]').forEach(b => b.onclick = () => hostInvite(+b.dataset.invite));
    box.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => { hostDrop(+b.dataset.drop, true); renderNetBox(); });
    box.querySelectorAll('[data-share]').forEach(b => { const i = +b.dataset.share.slice(1); b.onclick = () => shareCode(NET.peers[i].offerCode, 'Az utolsó fáklya – meghívó kód (' + S.seats[i].name + '): nyisd meg a játékot, nyomd meg a „Csatlakozás barátként” gombot, és illeszd be ezt:', note(i)); });
    box.querySelectorAll('[data-copy]').forEach(b => { const i = +b.dataset.copy.slice(1); b.onclick = () => copyCode(NET.peers[i].offerCode, note(i)); });
    box.querySelectorAll('[data-paste]').forEach(t => { const i = +t.dataset.paste.slice(1); t.oninput = () => { const packed = fromCode(t.value); if (!packed) { if (t.value.trim().length > 10) note(i)('Ez még nem teljes kód. Az UF1- kezdetű, egybefüggő szöveget kell beilleszteni.'); return; } NET.peers[i].note = ''; hostAnswer(i, packed); }; });

  /* ----- barát: csatlakozó képernyő ----- */

  /* ---------- vezérlő ---------- */
  function controller() {
    const ai = G.ai, st0 = G.st;
    const dead = () => G.st !== st0;
    return {
      async draft(st, h, shown) { if (dead()) return shown[0]; if (h.remote) return remote(h, 'draft', [h, shown], () => ai.draft(st, h, shown)); if (!h.human) { await pace(); return ai.draft(st, h, shown); } await ensureViewer(h.owner); return pickCard(h, shown); },
      async discard(st, h, hand) { if (dead() || !h.human) return ai.discard(st, h, hand); if (h.remote) return remote(h, 'discard', [h, hand], () => ai.discard(st, h, hand)); await ensureViewer(h.owner); return HUMAN.discard(st, h, hand); },
      async action(st, h, left) { if (dead()) return { t: 'pass' }; if (h.remote) { renderGame(); return remote(h, 'action', [h, left], () => ai.action(st, h, left)); } if (!h.human) { renderGame(); await pace(); return ai.action(st, h, left); } await ensureViewer(h.owner); return humanAction(h, left); },
      async join(st, o, h, str, kind) {
        if (dead()) return false;
        if (!o.human) return ai.join(st, o, h, str, kind);
        if (o.remote) return remote(o, 'join', [o, h, str, kind], () => ai.join(st, o, h, str, kind));
        await ensureViewer(o.owner);
        return HUMAN.join(st, o, h, str, kind);
      },
      async fightCards(st, x, ctx) { if (dead()) return { cards: [] }; if (!x.human) return ai.fightCards(st, x, ctx); if (x.remote) return remote(x, 'fightCards', [x, ctx], () => ai.fightCards(st, x, ctx)); await ensureViewer(x.owner); return humanFightCards(st, x, ctx); },
      async curse(st, o, h, pw, str, kind) {
        if (dead()) return null;
        if (!o.human) return ai.curse(st, o, h, pw, str, kind);
        if (o.remote) return remote(o, 'curse', [o, h, pw, str, kind], () => ai.curse(st, o, h, pw, str, kind));
        await ensureViewer(o.owner);
        return HUMAN.curse(st, o, h, pw, str, kind);
      },
      async cancel(st, o, h, parts, curses) { if (dead()) return false; if (!o.human) return ai.cancel(st, o, h, parts); if (o.remote) return remote(o, 'cancel', [o, h, parts, curses], () => ai.cancel(st, o, h, parts)); await ensureViewer(o.owner); return HUMAN.cancel(st, o, h, parts, curses); },
      async choose(st, h, kind, opt) {
        if (dead()) return null;
        if (!h.human) return ai.choose(st, h, kind, opt);
        if (h.remote) return remote(h, 'choose', [h, kind, opt], () => ai.choose(st, h, kind, opt));
        await ensureViewer(h.owner);
        return HUMAN.choose(st, h, kind, opt);
      },
      async accuse(st) { if (dead()) return null; return accusation(st, ai); },
      async traitorSabotage(st, h) { return ai.traitorSabotage(st, h); },
      async turnStart(st, h) { renderGame(); if (!h.human) await pace(); },
      async turnEnd() { renderGame(); },
      async darkShown(st) { if (dead()) return; renderGame(); hostEventAll('dark'); await darkDialog(); },
      async dungeonShown(st, card) { if (dead()) return; const fm = (K.Az(card) + ' ' + card + ' lap a kazamatáé marad: ' + K.CARDS[card].d.charAt(0).toLowerCase() + K.CARDS[card].d.slice(1)); flashDungeon(fm); hostEventAll('flash', { msg: fm }); renderGame(); await sleep(Math.min(900, speedMs() * 2)); },
      async fightShown(st, F) { if (dead()) return true; renderGame(); hostEventAll('fight', { F }); return showFight(F); }
    };
  }

  /* ---------- emberi döntések (ezen a telefonon; a barát telefonján ugyanezek futnak) ---------- */
  const HUMAN = {
    draft(st, h, shown) { return pickCard(h, shown); },
    discard(st, h, hand) { return ask('Túl sok lap', `<p>Legfeljebb ${st.R.handMax} lap lehet a kezedben. Melyiket dobod el? <b>Az eldobott lap kazamata-fele hat.</b></p>${cardsHtml(hand, true)}`, [], { cards: true }); },
    action(st, h, left) { return humanAction(h, left); },
    join(st, o, h, str, kind) {
      const pw = K.power(st, h) + K.activeBonus(st, h);
      return ask('Beszállsz?', `<p><b>${esc(h.name)}</b> ${kind === 'obj' ? 'egy célpontért' : kind === 'boss' ? 'a Mélység Urával' : 'egy szörnnyel'} harcol, az ellenfél ereje <b>${str}</b>.</p>${vsHtml(pw + K.helpPower(st, o), str, h.name + ': ' + pw + ' + te: ' + K.helpPower(st, o), 'ellenfél')}
          <p>Ha beszállsz, +${K.helpPower(st, o)} erőt adsz${o.cls === 'priest' ? ' (Áldás)' : ''}, és te is kijátszhatsz lapot. Győzelem esetén húzol egy kincset${o.cls === 'priest' ? ', és szintet is lépsz' : ''}${o.cls === 'thief' ? ', Tolvajként pedig még egyet' : ''}. Vereség esetén te is sebet kapsz.</p>`, [{ l: 'Beszállok', v: true, k: 'primary' }, { l: 'Kimaradok', v: false }]);
    },
    fightCards(st, x, ctx) { return humanFightCards(st, x, ctx); },
    curse(st, o, h, pw, str, kind) {
      const vals = [...new Set(o.curses)].sort((a, b) => b - a);
      return ask('Átok?', `<p><b>${esc(h.name)}</b> ${kind === 'boss' ? 'a Mélység Urával' : kind === 'obj' ? 'egy célpontért' : 'egy szörnnyel'} harcol.</p>${vsHtml(pw, str, 'hősök', 'ellenfél')}<p>Névtelenül kijátszhatsz egy Átkot: az ellenfél erejéhez adódik.${kind === 'boss' ? ' <b>Ha a főgonosz ellen buknak el, a fáklya is fogy.</b>' : ''}</p>`, vals.map(v => ({ l: 'Átok +' + v, v, k: 'violet' })).concat([{ l: 'Nem', v: null }]));
    },
    cancel(st, o, h, parts, curses) { return ask('Semmissé teszed?', `<p>Valaki Átkot játszott ki <b>${esc(h.name)}</b> harcában (${curses.map(c => '+' + c).join(', ')}). Körönként egyet semmissé tehetsz.</p>`, [{ l: 'Semmissé teszem', v: true, k: 'violet' }, { l: 'Hagyom', v: false }]); },
    choose(st, h, kind, opt) {
      if (kind === 'trap') return ask('Csapda!', `<p>${esc(h.name)} csapdába lépett. Vagy kapsz egy sebet, vagy feláldozol egy lapot a kezedből (ennek a kazamata-fele <b>nem</b> hat).</p>${cardsHtml(opt.cards, true)}`, [{ l: 'Vállalom a sebet', v: 'wound', k: 'danger' }], { cards: true });
      if (kind === 'shrine') return ask('Sötét oltárkő', `<p>Ha áldozol, ${esc(h.name)} egy szintet lép, de <b>a Mélység Ura +${opt.cost}</b>.</p>`, [{ l: 'Áldozok', v: true, k: 'violet' }, { l: 'Továbbmegyek', v: false }]);
      if (kind === 'secret') return ask('Rejtekút', '<p>Melyik zónába lépsz át?</p>', opt.zones.map(z => ({ l: K.ZNAME[z], v: z })).concat([{ l: 'Mégse', v: null }]));
      return Promise.resolve(null);
    },
    vote(st, v, by, target) { const tg = st.heroes[target]; return ask('Vád', `<p><b>${esc(st.heroes[by].name)}</b> szerint <b>${esc(tg.name)}</b> a Mélység szolgája.</p><p>Ha igaza van, az áruló elveszti a képességét és az Átkait. Ha nincs, a vádlók 2 hírnevet veszítenek.</p>`, [{ l: 'Egyetértek', v: true, k: 'danger' }, { l: 'Nem értek egyet', v: false }]); }
  };
  function faintDialog(h, why, lost) { return ask(h.name + ' elájult', `<p><b style="color:${hc(h.i)}">${esc(h.name)}</b> megkapta a harmadik sebét${why ? ' (' + esc(why) + ')' : ''}, ezért elájult.</p><p>Visszakerül a Bejáratba, a sebei begyógyulnak, de elveszti az aranya felét${lost ? ' (−' + lost + ' arany)' : ''}.</p><p class="note">Tipp: ha már 2 sebed van, pihenj, vagy játszd ki a Gyógyírt. A hőskártyán a piros négyzetek mutatják a sebeket.</p>`, [{ l: 'Értem', v: true, k: 'primary' }]); }
  function darkDialog() { return ask('Kialudt az utolsó fáklya', `<div class="darkic">${icon('emblem')}</div><p>Egy kör marad a sötétben. <b>Minden zónában új szörny terem</b>, a hősök vakon harcolnak: senki nem lát előre, nincs felderítés, és senki nem szállhat be más harcába.</p><p>Ha ebben a körben nem esik el a Mélység Ura, a sötétség elnyeli a hősöket.</p>`, [{ l: 'Utolsó esély', v: true, k: 'danger' }]); }
  async function pace() { renderGame(); await sleep(speedMs()); }
  function flashDungeon(msg) { G.flash = msg; toast(msg, 2600); }

  async function ensureViewer() { }
  async function showMissions() {
    const st = G.st, mineH = st.heroes.filter(h => h.human && h.owner === G.viewer);
    for (const h of st.heroes) if (h.remote) hostEvent(h.owner, 'missions');
    if (!mineH.length) return;
    await ask(st.solo ? 'Küldetések' : 'A titkos küldetésed', mineH.map(missionHtml).join('') + (st.R.traitor ? '<p class="note">Az áruló-szabály be van kapcsolva.</p>' : ''), [{ l: 'Indulás', v: true, k: 'primary' }]);
  }
  function missionHtml(h) { const m = K.MISSION_TXT[h.mission]; return `<div class="card" style="margin-top:8px"><b style="color:${hc(h.i)}">${esc(h.name)}</b> · ${esc(K.CLS[h.cls].name)}<br><span class="chip ${h.traitor ? 'rose' : 'violet'}">${esc(h.mission)}</span> ${esc(m[0])}${m[1] ? ' · <b>+' + m[1] + ' hírnév</b>' : ''}</div>`; }

  async function accusation(st, ai) {
    let target = null, by = null;
    if (st.pendingAccuse) { target = st.pendingAccuse.target; by = st.pendingAccuse.by; st.pendingAccuse = null; }
    else { const t = ai.accuse(st); if (t == null) return null; const pr = st.heroes.find(h => !h.human && h.i !== t && !h.traitor); if (!pr) return null; target = t; by = pr.i; }
    const tg = st.heroes[target]; let yes = 1, voters = 1;
    for (const v of st.heroes) {
      if (v.i === target || v.i === by) continue; voters++;
      let y;
      if (!v.human) y = v.traitor ? false : ai.voteYes(st, v, target);
      else if (v.remote) y = await remote(v, 'vote', [v, by, target], () => v.traitor ? false : ai.voteYes(st, v, target));
      else { await ensureViewer(v.owner); y = await ask('Vád', `<p><b>${esc(st.heroes[by].name)}</b> szerint <b>${esc(tg.name)}</b> a Mélység szolgája.</p><p>Ha igaza van, az áruló elveszti a képességét és az Átkait. Ha nincs, a vádlók 2 hírnevet veszítenek.</p>`, [{ l: 'Egyetértek', v: true, k: 'danger' }, { l: 'Nem értek egyet', v: false }]); }
      if (y) yes++;
    }
    if (yes * 2 <= voters) { st.accused = true; st.log.push({ r: st.round, msg: st.heroes[by].name + ' vádat emelt ' + tg.name + ' ellen, de a többség nem állt mellé.', kind: 'warn', who: null }); return null; }
    return target;
  }

  /* ---------- lapok megjelenítése ---------- */
  function cardHtml(c, pickable, extra) {
    const C = K.CARDS[c];
    return `<button class="acard ${pickable ? '' : 'static'}" data-v="${esc(c)}" ${pickable ? '' : 'tabindex="-1"'}>${extra || ''}<div class="t">${esc(c)}</div><div class="h">${esc(C.h)}</div><div class="d">${esc(C.d)}</div></button>`;
  }
  function cardsHtml(list, pickable) { return `<div class="cards">${list.map(c => cardHtml(c, pickable)).join('')}</div>`; }
  function pickCard(h, shown) {
    const last = shown.length === 2;
    return ask('Lapválasztás – ' + h.name, `<p>A választott lap a kezedbe kerül (most ${h.hand.length} lap, legfeljebb ${G.st.R.handMax}). ${last ? '<b>Te választasz utolsóként: a másik lap kazamata-fele azonnal hat.</b>' : 'A végén megmaradó lap kazamata-fele azonnal hat.'}</p>${last ? `<div class="cards">${shown.map(c => { const other = shown.find(x => x !== c) || c; return cardHtml(c, true).replace('</button>', `<div class="left">Ha ezt viszed, a kazamatáé lesz ${K.az(other)} <b>${esc(other)}</b>: ${esc(K.CARDS[other].d)}</div></button>`); }).join('')}</div>` : cardsHtml(shown, true)}${h.hand.length ? '<p class="label" style="margin-top:12px">A kezedben</p>' + `<div class="cards">${h.hand.map(c => cardHtml(c, false)).join('')}</div>` : ''}`, [], { cards: true, onlyCards: '.cards:first-of-type' });
  }
  function humanAction(h, left) { return new Promise(res => { G.ui = { hero: h, left, resolve: a => { G.ui = null; res(a); } }; renderGame(); }); }

  // harc: a lapok döntése akkor, amikor számít
  function humanFightCards(st, x, ctx) {
    const { kind, h, parts, str, pw, isActive } = ctx;
    return new Promise(res => {
      const ov = $('#ov'), dlg = $('#dlg');
      const sel = new Set();
      const fightCards = x.hand.map((c, i) => ({ c, i })).filter(o => K.CARDS[o.c].when === 'fight');
      const potions = parts.reduce((a, o) => a + o.potions, 0);
      const mageFree = x.cls === 'mage' && x.mageFreeRound !== st.round;
      const draw = () => {
        let add = 0, bossAdd = 0, shield = false, k = 0;
        for (const i of sel) { const C = K.CARDS[x.hand[i]]; { let v = (C.pw || 0) + (C.pwPer || 0) * parts.length; if (ctx.mt === 'golem') v = Math.floor(v / 2); add += v; } shield = shield || !!C.shield; const b = C.boss || 0; if (!(mageFree && k === 0)) bossAdd += b; k++; }
        const blind = !!ctx.blind;
        const target = str + (kind === 'boss' ? bossAdd : 0);
        const total = pw + add;
        const needP = total > target ? 0 : Math.ceil((target - total + 1) / 3);
        const potOk = needP > 0 && needP <= potions;
        const win = total > target || potOk;
        const M = ctx.mt ? K.MON[ctx.mt] : null;
        const title = kind === 'boss' ? 'Harc a Mélység Urával' : kind === 'obj' ? 'Célpont' : ctx.blind ? 'Harc a sötétben – ' + K.ZNAME[h.pos] : (M ? M.name : 'Szörny') + ' – ' + K.ZNAME[h.pos];
        const typeInfo = ctx.blind ? '<div class="card" style="margin:6px 0">Valami megmozdul a sötétben…</div>' : M ? `<div class="card" style="margin:6px 0"><b>${esc(M.name)}</b>: ${esc(M.trait)}. <span class="note">${esc(M.weakTxt)}.</span>${ctx.F && ctx.F.typeAdj ? `<br><b style="color:${ctx.F.typeAdj < 0 ? 'var(--green)' : 'var(--mon)'}">Most: ${ctx.F.typeAdj > 0 ? '+' : ''}${ctx.F.typeAdj} az ellenfélnek</b>${ctx.F.surprise && ctx.mt === 'pok' ? ' (lesből támadt)' : ''}` : ''}</div>` : '';
        dlg.innerHTML = `<div class="fhead">${kind === 'boss' ? icon('boss', 'big') : ctx.mt && !ctx.blind ? icon(ctx.mt, 'big') : ''}<h2>${esc(title)}</h2></div>
          ${typeInfo}
          <p>${isActive ? '' : 'Beszállóként '}<b style="color:${hc(x.i)}">${esc(x.name)}</b>, ${isActive ? 'te harcolsz' : esc(h.name) + ' harcában'}. ${parts.length > 1 ? 'Harcolnak: ' + parts.map(o => esc(o.name)).join(', ') + '.' : ''}</p>
          ${vsHtml(total, blind ? '?' : target, 'erőtök' + (add ? ' (' + pw + ' + ' + add + ' lap)' : ''), blind ? 'a sötétben nem látod' : kind === 'boss' && bossAdd ? 'Mélység Ura (+' + bossAdd + ' a lapoktól)' : 'ellenfél')}
          ${blind ? '<p class="verdict loss">Vakon harcolsz</p><p class="note" style="text-align:center">' + (K.DEPTH[h.pos] === 1 ? 'Az' : 'A') + ' ' + K.DEPTH[h.pos] + '. mélységben a szörnyek ereje ' + G.st.R.monsterStr[K.DEPTH[h.pos]].join('–') + ' (plusz a fajta és a hatások).</p>' : `<p class="verdict ${win ? 'win' : 'loss'}">${total > target ? 'Így győztök' : potOk ? 'Italokkal győztök (' + needP + ' ital)' : total === target ? 'Döntetlen = vereség' : 'Így vesztetek'}</p>`}
          ${fightCards.length ? `<p class="label">Harci lapjaid – koppints a kijátszáshoz</p><div class="cards">${fightCards.map(o => cardHtml(o.c, true, sel.has(o.i) ? '<div class="pickmark">kijátszva</div>' : '').replace('class="acard', 'data-i="' + o.i + '" class="acard' + (sel.has(o.i) ? ' sel' : ''))).join('')}</div>
            <p class="note">Minden kijátszott lap kazamata-fele azonnal hat${mageFree ? ' (Varázslat: az első lapod kazamata-fele nem hat)' : ''}.${kind === 'boss' ? ' A főgonosz ellen ez rögtön a célt is növeli.' : ''}</p>` : '<p class="note">Nincs harci lapod.</p>'}
          ${shield ? '<p class="note" style="color:#86efac">Pajzs: ha vesztetek, senki nem kap sebet.</p>' : ''}
          <div class="btns"><button class="btn ${win ? 'primary' : 'danger'}" id="fgo">${isActive ? 'Harc!' : 'Kész'}</button>${isActive && kind !== 'boss' && !blind ? '<button class="btn" id="fback">Visszahúzódás</button>' : ''}</div>
          ${isActive && kind === 'mon' && !blind ? '<p class="note">Visszahúzódáskor visszalépsz oda, ahonnan jöttél; a szörny ott marad. Vereség esetén sebet kaptok, és szintén visszaszorulsz.</p>' : ''}`;
        dlg.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (sel.has(i)) sel.delete(i); else sel.add(i); draw(); });
        $('#fgo').onclick = () => { ov.hidden = true; dlg.innerHTML = ''; res({ cards: [...sel].map(i => x.hand[i]) }); };
        const fb = $('#fback'); if (fb) fb.onclick = () => { ov.hidden = true; dlg.innerHTML = ''; res({ retreat: true }); };
      };
      ov.hidden = false; draw();
    });
  }

  /* ---------- párbeszédablak ---------- */
  let dlgQueue = Promise.resolve();
  function ask(title, html, buttons, opt) {
    const run = () => new Promise(res => {
      const ov = $('#ov'), dlg = $('#dlg');
      dlg.innerHTML = `<h2>${esc(title)}</h2>${html}<div class="btns">${buttons.map((b, i) => `<button class="btn ${b.k || ''}" data-b="${i}">${esc(b.l)}</button>`).join('')}</div>`;
      ov.hidden = false;
      const done = v => { ov.hidden = true; dlg.innerHTML = ''; res(v); };
      dlg.querySelectorAll('[data-b]').forEach(b => b.onclick = () => done(buttons[+b.dataset.b].v));
      if (opt && opt.cards) dlg.querySelectorAll('.acard:not(.static)').forEach(b => b.onclick = () => done(b.dataset.v));
      const f = dlg.querySelector('.acard:not(.static), .btn.primary, .btn'); if (f) f.focus();
    });
    const p = dlgQueue.then(run); dlgQueue = p.catch(() => { }); return p;
  }
  function vsHtml(a, b, la, lb) { return `<div class="vs"><div><span class="a">${a}</span><small>${esc(la)}</small></div><span style="color:var(--muted);font-size:16px">vs</span><div><span class="b">${b}</span><small>${esc(lb)}</small></div></div>`; }
  function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms || 2400); }

  async function showFight(F) {
    const st = G.st, a = st.heroes[F.active], inv = [a, ...F.helpers.map(i => st.heroes[i])];
    if (F.retreat) { if (inv.some(isLocal)) toast(a.name + ' visszahúzódott.'); else toast(a.name + ' visszahúzódott ' + (F.kind === 'mon' ? 'egy ' + F.str + ' erejű ' + (F.mt ? K.MON[F.mt].name.toLowerCase() : 'szörny') : K.azw(F.foe)) + ' elől.', 1800); return; }
    const humanIn = inv.some(isLocal) || F.kind === 'boss';
    const cardsTxt = F.played.length ? F.played.map(p => st.heroes[p.who].name + ': ' + p.name).join(', ') : '';
    if (!humanIn) { toast(`${K.joinNames(inv.map(x => x.name))} ${F.win ? (inv.length > 1 ? 'győztek' : 'győzött') : (inv.length > 1 ? 'elbuktak' : 'elbukott')} (${F.pw} ${K.azw(F.target)} ellen)${cardsTxt ? ' · lapok: ' + cardsTxt : ''}${F.curseCount ? ' · Átok!' : ''}`, Math.max(1800, speedMs() * 3)); await sleep(speedMs()); return; }
    const title = F.kind === 'boss' ? 'Harc a Mélység Urával' : F.kind === 'obj' ? 'Célpont: ' + F.foe : (F.mt ? K.MON[F.mt].name : 'Harc') + ' – ' + K.ZNAME[F.zone];
    await ask(title, `<p>${inv.map(x => `<b style="color:${hc(x.i)}">${esc(x.name)}</b>`).join(' + ')}</p>
      ${vsHtml(F.pw, F.target, F.parts.map(x => x.n + ' ' + x.v).join(' + ') + (F.cardPw ? ' + lapok ' + F.cardPw : '') + (F.pw > F.parts.reduce((s, x) => s + x.v, 0) + F.cardPw ? ' + ital' : ''), F.curses ? `ellenfél (${F.str} + Átok ${F.curses})` : 'ellenfél')}
      <p class="verdict ${F.win ? 'win' : 'loss'}">${F.win ? 'Győzelem!' : 'Vereség'}</p>
      ${!F.win && F.pw === F.target ? '<p class="note" style="text-align:center">Döntetlen: ilyenkor az ellenfél nyer.</p>' : ''}
      ${cardsTxt ? `<p class="note">Kijátszott lapok: ${esc(cardsTxt)}.</p>` : ''}
      ${F.curseCount ? `<p style="color:#c4b5fd">Valaki névtelenül Átkot játszott ki.</p>` : ''}
      ${F.notes.map(n => `<p class="note">${esc(n)}</p>`).join('')}`, [{ l: 'Tovább', v: true, k: 'primary' }]);
  }

  /* ---------- játéktér ---------- */
  const POS = { B: [150, 34], L3: [50, 118], M3: [150, 118], R3: [250, 118], L2: [50, 206], M2: [150, 206], R2: [250, 206], L1: [50, 294], M1: [150, 294], R1: [250, 294], E: [150, 372] };
  const ENC_IC = { treasure: ['◆ kincs', 'gold'], trap: ['⚠ csapda', 'mon'], shrine: ['◈ oltárkő', 'violet'], spring: ['✚ forrás', 'good'] };
  function zoneContent(z) {
    const st = G.st, zn = st.zones[z];
    if (z === 'B') return { txt: '' + K.bossStr(st), cls: 'mon', ic: 'boss' };
    if (z === 'E') return { txt: '⌂', cls: 'good' };
    if (st.dark && K.DEPTH[z] >= 1 && K.DEPTH[z] <= 3) return { txt: '?', cls: 'unk' };
    if (!viewerKnows(z)) { const r = st.R.monsterStr[K.DEPTH[z]]; return { txt: '? ' + r[0] + '–' + r[1], cls: 'unk' }; }
    const c = zn.card, sc = zn.revealed ? '' : '👁';
    if (c.t === 'mon') { const mp = K.monPlus(st); return { txt: sc + c.str + (mp ? '+' + mp : ''), cls: 'mon', ic: c.mt }; }
    const e = ENC_IC[c.t]; return { txt: sc + e[0], cls: e[1], small: true };
  }
  function mapSvg(targets) {
    const st = G.st;
    let s = `<svg class="map" viewBox="0 0 300 400" role="img" aria-label="A kazamata térképe">`;
    for (const [a, b] of K.EDGES) { const [x1, y1] = POS[a], [x2, y2] = POS[b]; const diag = a !== 'E' && b !== 'B' && x1 !== x2 && y1 !== y2; s += `<line class="edge ${diag ? 'diag' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
    for (const z of K.ZONES) {
      const [x, y] = POS[z], d = K.DEPTH[z], t = targets[z], ui = G.ui;
      const here = ui && ui.hero.pos === z;
      const cls = ['zone', z === 'B' ? 'boss' : 'd' + d, t ? 'tg' : '', t && t.scout && !t.move ? 'sc' : '', here ? 'here' : ''].join(' ');
      const c = zoneContent(z);
      s += `<g class="${cls}" data-z="${z}" ${t ? 'role="button" tabindex="0" aria-label="' + K.ZNAME[z] + '"' : ''}>
        <rect x="${x - 40}" y="${y - 27}" width="80" height="54" rx="10"/>
        <text class="zn" x="${x}" y="${y - 15}" text-anchor="middle">${K.ZNAME[z].toUpperCase()}${d >= 1 && d <= 3 ? ' · ' + d : ''}</text>
        ${c.ic ? nested(c.ic, x - 36, y - 13, 26, 26) : ''}<text class="zc ${c.cls}" x="${c.ic ? x + 8 : x}" y="${y + (c.sub ? 1 : 4)}" text-anchor="middle" ${c.small ? 'style="font-size:11px"' : ''}>${c.txt}</text>${c.sub ? `<text class="zn" x="${c.ic ? x + 10 : x}" y="${y + 11}" text-anchor="middle">${esc(c.sub)}</text>` : ''}
      </g>`;
      const ob = st.objectives.find(o => o.zone === z);
      if (ob) s += `<g class="obj"><polygon points="${x + 30},${y - 34} ${x + 42},${y - 22} ${x + 30},${y - 10} ${x + 18},${y - 22}"/><text x="${x + 30}" y="${y - 19}" text-anchor="middle">${ob.str}</text><text x="${x + 30}" y="${y - 38}" text-anchor="middle" style="fill:var(--gold)">${ob.name} ${ob.life}k</text></g>`;
      const hs = st.heroes.filter(h => h.pos === z);
      hs.forEach((h, k) => { const hx = x - (hs.length - 1) * 10 + k * 20, hy = y + 20; s += `<g class="tok"><circle cx="${hx}" cy="${hy}" r="8.5" fill="#0a0f1f" stroke="${hc(h.i)}" stroke-width="${st.turn === h.i ? 2.4 : 1.3}"/>${nested(CLS_ICON[h.cls], hx - 6.5, hy - 7, 13, 13)}</g>`; });
    }
    return s + '</svg>';
  }
  function modsHtml(st) {
    const out = [];
    for (const m of K.activeMods(st)) {
      if (m.t === 'monPlus') out.push(`<span class="chip rose">Szörnyek +${m.v} (${K.az(m.until)} ${m.until}. kör végéig)</span>`);
      if (m.t === 'noHelp') out.push(`<span class="chip rose">Nincs beszállás (${K.az(m.until)} ${m.until}. kör végéig)</span>`);
    }
    if (st.nextFightPlus) out.push(`<span class="chip rose">Következő harc: ellenfél +${st.nextFightPlus}</span>`);
    if (st.objBonus) out.push(`<span class="chip rose">Célpontok +${st.objBonus}</span>`);
    return out.join(' ');
  }
  function bossBreakdown(st) {
    const k = st.H - st.heroes.filter(h => h.exposed).length;
    const base = st.R.bossTable[k], g = st.R.bossGrow ? st.R.bossGrow[k] : 0, grown = g * (st.round - 1), add = K.bossAddSum(st);
    return `<div class="bossbar"><span>Mélység Ura: <b>${base}</b> (${k} hős ellen)</span>${g ? `<span class="plus">+${grown} idő (körönként +${g})</span>` : ''}${add ? `<span class="plus">+${add} kazamata</span>` : ''}${st.bossMinus ? `<span class="minus">−${st.bossMinus} célpont/ostrom</span>` : ''}<span>= <b class="bnum">${K.bossStr(st)}</b></span></div>
      <div class="bosslog">${modsHtml(st)} ${st.bossAdd.slice(-4).reverse().map(x => `<span class="chip plain">+${x.v} ${esc(x.src)}</span>`).join(' ')}</div>`;
  }
  function renderGame() {
    const st = G.st; if (!st) return;
    hostPushState();
    const app = $('#app'), ui = G.ui, targets = {};
    let acts = [];
    if (ui) {
      acts = K.legalActions(st, ui.hero);
      for (const a of acts) {
        if (a.t === 'move') { targets[a.to] = targets[a.to] || {}; targets[a.to].move = a; }
        if (a.t === 'scout') { targets[a.z] = targets[a.z] || {}; targets[a.z].scout = a; }
      }
    }
    const marks = st.R.objectives.map(o => o.at);
    const torch = Array.from({ length: st.R.torch }, (_, i) => `<i class="${i < st.torch ? 'on' : ''} ${marks.includes(i + 1) ? 'mk' : ''}"></i>`).join('');
    const turnH = st.turn != null ? st.heroes[st.turn] : null;
    const teamPw = Math.max(...st.heroes.filter(h => !h.exposed).map(h => K.power(st, h) + K.activeBonus(st, h) + st.heroes.filter(o => o !== h && !o.exposed).reduce((x, o) => x + K.helpPower(st, o), 0)));
    document.body.classList.toggle('darkround', !!st.dark);
    app.innerHTML = `
      ${st.dark ? '<div class="darkbanner">Sötétség – az utolsó kör. Vakon harcoltok, nincs felderítés, nincs beszállás.</div>' : ''}
      <div class="top">
        <div><div class="ttl">${st.round}. kör ${st.phase === 'draft' ? '· lapválasztás' : turnH ? '· ' + esc(turnH.name) : ''}</div>
          <div class="row" style="margin-top:4px"><span class="torch" aria-label="Fáklya: ${st.torch}">${torch}</span><span class="stat">fáklya <b>${Math.max(0, st.torch)}</b></span></div></div>
        <div class="row"><span class="stat" title="A legerősebb hős ereje + a többiek segítsége, lapok nélkül">közös erő <b style="color:${teamPw > K.bossStr(st) ? 'var(--green)' : 'var(--hero)'}">${teamPw}</b> / Mélység Ura <b>${K.bossStr(st)}</b></span>
          <button class="btn small" id="help">?</button><button class="btn small" id="quit">Kilépés</button></div>
      </div>
      ${bossBreakdown(st)}
      <div class="layout">
        <div class="card mapwrap">${mapSvg(targets)}</div>
        <div class="panel">
          ${turnPanel(acts)}
          <div class="heroes">${st.heroes.map(heroCard).join('')}</div>
          <div class="card"><p class="label">Napló</p><div class="log">${logHtml()}</div></div>
        </div>
      </div>`;
    $('#help').onclick = () => ask('Szabályok röviden', rulesHtml().replace('<details', '<div').replace('</details>', '</div>').replace(/<summary>.*?<\/summary>/, ''), [{ l: 'Bezár', v: true, k: 'primary' }]);
    $('#quit').onclick = async () => {
      if (NET.role === 'guest') { const ok = await ask('Kilépés', '<p>Biztosan kilépsz? A hősödet egy bot viszi tovább.</p>', [{ l: 'Kilépek', v: true, k: 'danger' }, { l: 'Maradok', v: false }]); if (ok) guestLeave(); return; }
      const ok = await ask('Kilépés', '<p>Biztosan félbehagyod a játszmát?</p>' + (NET.role === 'host' ? '<p class="note">A barátaid kapcsolata megmarad, új játékot indíthatsz velük.</p>' : ''), [{ l: 'Kilépek', v: true, k: 'danger' }, { l: 'Maradok', v: false }]);
      if (ok) { G.token++; G.ui = null; G.st = null; for (const id in NET.pending) { NET.pending[id].reject(new Error('kilépés')); delete NET.pending[id]; } hostBroadcast({ t: 'lobby', msg: 'A házigazda félbehagyta a játszmát. Várjuk az új játékot.' }); renderSetup(); }
    };
    app.querySelectorAll('.zone.tg').forEach(g => { const go = () => zoneTap(g.dataset.z, targets[g.dataset.z]); g.onclick = go; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; });
    app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const a = JSON.parse(b.dataset.act); if (G.ui) G.ui.resolve(a); });
    const acc = $('#accuse'); if (acc) acc.onclick = startAccuse;
  }
  async function zoneTap(z, t) {
    if (!G.ui || !t) return;
    const ui = G.ui;
    if (t.move && t.scout) {
      const v = await ask(K.ZNAME[z], '<p>Mit teszel? Ha belépsz, azonnal felfordul, ami ott vár.</p>', [{ l: 'Belépek', v: 'move', k: 'primary' }, { l: 'Felderítem', v: 'scout', k: 'violet' }, { l: 'Mégse', v: null }]);
      if (!v || G.ui !== ui) return; ui.resolve(t[v]);
    } else ui.resolve(t.move || t.scout);
  }
  function turnPanel(acts) {
    const st = G.st, ui = G.ui;
    if (!ui) {
      const th = st.turn != null ? st.heroes[st.turn] : null;
      return `<div class="turn"><h3>${st.phase === 'draft' ? 'Lapválasztás…' : th ? esc(th.name) + ' köre' : 'A kazamata köre…'}</h3><p class="note">${th && !th.human ? 'A bot gondolkodik.' : th && th.remote ? 'A saját telefonján dönt.' : 'Várakozás…'}</p></div>`;
    }
    const h = ui.hero, z = h.pos;
    const btn = (a, label, k, title) => `<button class="btn ${k || ''}" data-act='${esc(JSON.stringify(a))}' ${title ? 'title="' + esc(title) + '"' : ''}>${esc(label)}</button>`;
    const out = [], has = t => acts.filter(a => a.t === t);
    if (has('explore').length) { const known = viewerKnows(z) ? st.zones[z].card : null; out.push(btn({ t: 'explore' }, 'Átkutatom ezt a zónát' + (known ? ' (' + (known.t === 'mon' ? K.MON[known.mt].name + ', ' + known.str : K.ENC_NAME[known.t].toLowerCase()) + ')' : ''), 'primary')); }
    for (const a of has('obj')) { const ob = st.objectives.find(o => o.name === a.ob); out.push(btn(a, K.Az(ob.name) + ' ' + ob.name + ' megszerzése (ereje: ' + ob.str + ')', 'gold')); }
    if (has('boss').length) { const atB = st.heroes.filter(o => o.pos === 'B'); const pw = K.power(st, h) + K.activeBonus(st, h) + atB.filter(o => o !== h).reduce((x, o) => x + K.helpPower(st, o), 0); out.push(btn({ t: 'boss' }, 'Támadás a Mélység Ura ellen: ' + pw + ' ' + K.azw(K.bossStr(st, atB.length)) + ' ellen (' + atB.length + ' hős van itt)', 'danger')); }
    if (has('siege').length) out.push(btn({ t: 'siege' }, 'Ostrom (a Mélység Ura −1, te egy sebet kapsz)', 'gold'));
    if (has('rest').length) out.push(btn({ t: 'rest' }, h.cls === 'priest' ? 'Pihenés (a zónádban mindenki gyógyul)' : 'Pihenés (egy seb begyógyul)'));
    for (const a of has('card')) out.push(btn(a, a.card + ': ' + K.CARDS[a.card].h.charAt(0).toLowerCase() + K.CARDS[a.card].h.slice(1), 'violet', 'Kazamata-fele: ' + K.CARDS[a.card].d));
    if (h.traitor && !h.traitorUsed && !h.exposed) out.push(btn({ t: 'sabotage' }, 'Fáklya elfojtása (titkos, egyszer)', 'danger'));
    out.push(btn({ t: 'pass' }, 'Köröm vége'));
    const far = Math.max(...st.heroes.filter(x => !x.traitor || !x.human).map(x => K.DIST[x.pos].B)), need = Math.ceil(far / 2);
    const tp = Math.max(...st.heroes.map(x => K.power(st, x) + K.activeBonus(st, x) + st.heroes.filter(o => o !== x).reduce((y, o) => y + K.helpPower(st, o), 0)));
    const hint = st.torch <= need + 1 ? `<p class="note" style="color:#fde68a"><b>Indulni kell a Barlangba!</b> A legtávolabbi hősnek ${far} lépésre (${need} körre) van szüksége.</p>` : tp > K.bossStr(st) ? `<p class="note" style="color:#86efac"><b>Elég erősek vagytok</b> a Mélység Ura ellen (${tp} ${K.azw(K.bossStr(st))} ellen), ha mindannyian a Barlangba értek.</p>` : '';
    return `<div class="turn me"><h3 style="color:${hc(h.i)}">${esc(h.name)} – még ${ui.left} akció</h3>
      <p class="note">Koppints egy kiemelt zónára: <span style="color:var(--hero)">kék</span> = belépés (azonnal felfordul, ami ott vár), <span style="color:var(--violet)">lila szaggatott</span> = felderítés.</p>
      ${hint}
      ${st.round <= 2 ? '<p class="note">Tipp: az 1. mélységben (ahol 2–4 erejű szörnyek vannak) lehet a legbiztosabban szintet lépni. A lapjaidat a harc előtt, az ellenfél ismeretében játszod ki.</p>' : ''}
      <div class="actions">${out.join('')}</div>
      ${st.R.traitor && st.H >= 3 && !st.accused && !st.pendingAccuse ? '<div class="actions"><button class="btn small danger" id="accuse">Vád indítása (a következő kör elején)</button></div>' : ''}
    </div>`;
  }
  async function startAccuse() {
    const st = G.st, h = G.ui && G.ui.hero; if (!h) return;
    const t = await ask('Kit vádolsz?', '<p>A következő kör elején a többiek szavaznak. Ha igazad van, az áruló elveszti a képességét és az Átkait. Ha tévedtél, a vádlók 2 hírnevet veszítenek. Játékonként egy vád lehet.</p>', st.heroes.filter(o => o !== h).map(o => ({ l: o.name, v: o.i, k: 'danger' })).concat([{ l: 'Mégse', v: null }]));
    if (t != null && NET.role === 'guest') { if (NET.guest && NET.guest.connected) sendRaw(NET.guest.dc, { t: 'accuse', target: t }); }
    if (t != null) { st.pendingAccuse = { by: h.i, target: t }; toast('A vád a következő kör elején kerül szavazásra.'); renderGame(); }
  }
  function heroCard(h) {
    const st = G.st, me = (h.human && h.owner === G.viewer) || st.solo;
    const w = Array.from({ length: st.R.maxWounds }, (_, i) => `<i class="${i < h.wounds ? 'on' : ''}"></i>`).join('');
    const items = h.items.length ? h.items.map(v => '+' + v).join(' ') : '–';
    let priv = '';
    if (me) {
      const m = K.MISSION_TXT[h.mission];
      priv = `<div class="priv"><b>${esc(h.mission)}</b>: ${esc(m[0])}${m[1] ? ' (+' + m[1] + ')' : ''}${!st.solo ? ` · Átok: ${h.curses.length ? h.curses.map(c => '+' + c).join(' ') : 'nincs'}` : ''}</div>
        <div class="hand">${h.hand.length ? h.hand.map(c => `<span class="hcard" title="${esc(K.CARDS[c].h + ' / kazamata: ' + K.CARDS[c].d)}"><b>${esc(c)}</b><small>${esc(K.CARDS[c].h)}</small><small class="dd">${esc(K.CARDS[c].d)}</small></span>`).join('') : '<span class="note">Nincs lap a kezedben.</span>'}</div>`;
    }
    return `<div class="hc ${st.turn === h.i ? 'act' : ''}">
      <div class="nm"><span class="hic">${icon(CLS_ICON[h.cls])}</span>${esc(h.name)} <span class="chip plain">${esc(K.CLS[h.cls].name)}</span>${h.exposed ? '<span class="chip rose">áruló</span>' : ''}${!h.human ? '<span class="chip plain">bot</span>' : h.remote && NET.role === 'host' ? '<span class="chip plain">barát</span>' : ''}</div>
      <div class="meta"><span>szint <b>${h.level}</b></span><span>erő <b>${K.power(st, h)}${K.activeBonus(st, h) ? '+' + K.activeBonus(st, h) : ''}</b></span><span>arany <b>${h.gold}</b></span><span>hírnév <b>${K.fame(st, h)}</b>+?</span>
        <span>tárgy <b>${items}</b></span>${h.potions ? `<span>ital <b>${h.potions}</b></span>` : ''}<span>lap <b>${h.hand.length}</b></span>
        <span class="wounds" title="sebek">${w}</span><span>${esc(K.ZNAME[h.pos])}</span></div>
      <p class="note" style="margin-top:4px">${esc(K.CLS[h.cls].abil)}</p>
      ${priv}
    </div>`;
  }
  function logHtml() {
    const st = G.st, mine = new Set(st.heroes.filter(h => h.human && h.owner === G.viewer).map(h => h.i));
    return st.log.filter(l => l.who == null || mine.has(l.who) || st.solo).slice(-90).reverse().map(l => `<div class="${l.kind}">${esc(l.msg)}</div>`).join('');
  }

  /* ---------- vége ---------- */
  async function showEnd(R) {
    const st = G.st;
    const rows = R.res.slice().sort((a, b) => b.fame - a.fame).map(r => `<tr><td><b style="color:${hc(r.i)}">${esc(r.name)}</b>${r.traitor ? ' <span class="chip rose">áruló</span>' : ''}<br><span class="note">${esc(r.mission)}${r.mpts ? ' ✓' : ''}</span></td><td>${r.level}</td><td>${r.gold}</td><td>${r.obj + r.boss}</td><td>${r.mpts}</td><td><b>${r.fame}</b></td></tr>`).join('');
    let head;
    if (st.over === 'win') head = st.solo ? `<p class="verdict win">A Mélység Ura elesett!</p><div class="stars">${'★'.repeat(R.stars)}${'☆'.repeat(3 - R.stars)}</div><p class="note" style="text-align:center">Összes hírnév: ${R.res.reduce((a, r) => a + r.fame, 0)} (2 csillag: ${st.R.star2}, 3 csillag: ${st.R.star3})</p>`
      : `<p class="verdict win">A Mélység Ura elesett!</p><p style="text-align:center">Győztes: <b style="color:${hc(R.winner)}">${esc(st.heroes[R.winner].name)}</b></p>`;
    else head = `<p class="verdict loss">${st.dark ? 'A sötétség elnyelte a hősöket.' : 'Kialudt a fáklya.'}</p>${R.traitorWin ? `<p style="text-align:center">Az áruló nyert: <b>${esc(st.heroes.find(h => h.traitor).name)}</b></p>` : '<p style="text-align:center">Mindenki veszített.</p>'}<p class="note" style="text-align:center">A Mélység Urának ereje végül ${K.bossStr(st)} volt, ebből ${K.bossAddSum(st)} a kazamatától származott.</p>`;
    const tbl = `<table class="res"><thead><tr><th>Hős</th><th>Szint</th><th>Arany</th><th>Célp.+Úr</th><th>Küld.</th><th>Össz.</th></tr></thead><tbody>${rows}</tbody></table>`;
    if (NET.role === 'guest') { await ask('Vége', head + tbl, [{ l: 'Rendben', v: true, k: 'primary' }]); if (NET.role === 'guest' && G.st === st) { G.st = null; G.ui = null; NET.guest.note = 'Várjuk, hogy a házigazda új játékot indítson.'; renderGuest(); } return; }
    const v = await ask('Vége', head + tbl, [{ l: 'Új játék ugyanígy', v: 'again', k: 'primary' }, { l: 'Beállítások', v: 'setup' }]);
    if (v === 'again') startGame(); else { hostBroadcast({ t: 'lobby', msg: 'A házigazda a beállításoknál van. Várjuk az új játékot.' }); renderSetup(); }
  }

  renderSetup();
})();

</script>
</body>
</html>
