<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amőba hang és haptika</title>
<style>
  :root { --bg:#f4f4f6; --fg:#1c1c1e; --card:#fff; --acc:#0a84ff; --o:#e8772e; --mut:#6e6e73; --ok:#30a14e; --bad:#d1242f;
          --cell:#ecebe6; --line:#d6d4cc; --win:#ffe08a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f7; --card:#1c1c1e; --mut:#98989d;
          --cell:#2a2a2d; --line:#3a3a3e; --win:#5a4a12; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; padding-top:max(16px, env(safe-area-inset-top)); background:var(--bg); color:var(--fg);
         font:16px/1.4 -apple-system, system-ui, sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:22px; margin:4px 0 12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin:0 0 10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bar { display:flex; gap:8px; margin-top:10px; }
  button { width:100%; padding:12px 8px; border:0; border-radius:12px; background:var(--acc); color:#fff;
           font-size:15px; font-weight:600; touch-action:manipulation; }
  button small { display:block; font-weight:400; font-size:11px; opacity:.8; margin-top:2px; }
  button.sec { background:transparent; color:var(--acc); border:1.5px solid var(--acc); }
  button:active { transform:scale(.97); opacity:.85; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:14px; gap:12px; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
  .hint { font-size:13px; color:var(--mut); margin:6px 0 0; }
  #log { font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:140px; overflow:auto; color:var(--mut); }
  label.native { display:flex; align-items:center; justify-content:space-between; font-size:15px; padding:4px 0; }
  input[type=range] { flex:1; max-width:55%; }

  #board { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; background:var(--line); padding:3px; border-radius:10px;
           touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .c { aspect-ratio:1; background:var(--cell); border-radius:6px; display:grid; place-items:center;
       font-size:clamp(20px,7vw,34px); font-weight:700; line-height:1; transition:background .2s; }
  .c.X { color:var(--acc); } .c.O { color:var(--o); }
  .c.last { box-shadow:inset 0 0 0 2px currentColor; }
  .c.w { background:var(--win); }
  .c.pop { animation:pop .18s ease-out; }
  @keyframes pop { from { transform:scale(.6); opacity:.3; } to { transform:scale(1); opacity:1; } }
  #status { font-weight:600; margin:0 0 10px; min-height:1.4em; }
</style>
</head>
<body>
<h1>Amőba – hang és haptika</h1>

<div class="card">
  <h2>Mini amőba (7×7, négy nyer)</h2>
  <p id="status"></p>
  <div id="board"></div>
  <div class="bar">
    <button id="new">Új játék</button>
    <button class="sec" id="undo">Visszavonás</button>
  </div>
  <label class="native" style="margin-top:8px">Gép játszik O-val <input type="checkbox" switch id="ai"></label>
</div>

<div class="card">
  <h2>Beállítások</h2>
  <label class="native">Hang <input type="checkbox" switch id="snd"></label>
  <div class="row"><span>Hangerő</span><input type="range" id="vol" min="0" max="1" step="0.05"></div>
  <label class="native">Rezgés <input type="checkbox" switch id="hap"></label>
  <div class="row"><span>iOS tick-köz: <b id="gapv"></b> ms</span><input type="range" id="gap" min="30" max="200" step="10"></div>
  <p class="hint">iPhone-on a néma kapcsoló a hangot is elnémítja (szándékosan, játékhoz ez illik).</p>
</div>

<div class="card">
  <h2>Hatások egyenként</h2>
  <div class="grid" id="fxgrid"></div>
</div>

<div class="card">
  <h2>Környezet</h2>
  <div class="row"><span>Haptika mód</span><span id="mode"></span></div>
  <div class="row"><span>Web Audio</span><span id="wa"></span></div>
  <div class="row"><span>Hangkontextus</span><span id="ctxs">még nem indult</span></div>
  <div class="row"><span>Online</span><span id="net"></span></div>
</div>

<div class="card">
  <h2>Napló</h2>
  <div id="log"></div>
</div>

<script>
/* ================================================================
   Haptics – egyesített haptikus visszajelzés
   Android/Chrome: navigator.vibrate() mintákkal
   iOS Safari 17.4+: rejtett <input type="checkbox" switch> trükk
   ================================================================ */
const Haptics = (() => {
  const PRESETS = {
    tap:     { android: 10,                    ios: 1 },
    select:  { android: 6,                     ios: 1 },
    move:    { android: 18,                    ios: 1 },
    success: { android: [20, 60, 30],          ios: 2 },
    warning: { android: [40, 90, 40],          ios: 2 },
    error:   { android: [50, 50, 50, 50, 80],  ios: 3 },
    heavy:   { android: 70,                    ios: 1 },
    win:     { android: [30, 50, 30, 50, 120], ios: 4 },
  };
  const KEY = 'haptics-enabled';
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const probe = document.createElement('input');
  probe.type = 'checkbox'; probe.setAttribute('switch', '');
  const mode = isIOS ? ('switch' in probe ? 'ios-switch' : 'none')
                     : (typeof navigator.vibrate === 'function' ? 'vibrate' : 'none');
  let enabled = true;
  try { enabled = localStorage.getItem(KEY) !== '0'; } catch (e) {}
  let iosGap = 70, timers = [], label = null;

  if (mode === 'ios-switch') {
    const inp = document.createElement('input');
    inp.type = 'checkbox'; inp.id = 'hx-' + Math.random().toString(36).slice(2);
    inp.setAttribute('switch', ''); inp.tabIndex = -1;
    label = document.createElement('label'); label.htmlFor = inp.id;
    for (const el of [inp, label]) {
      el.setAttribute('aria-hidden', 'true');
      el.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none;';
    }
    const attach = () => document.body.append(inp, label);
    document.body ? attach() : document.addEventListener('DOMContentLoaded', attach);
  }

  function cancel() {
    timers.forEach(clearTimeout); timers = [];
    if (mode === 'vibrate') navigator.vibrate(0);
  }
  function play(what = 'tap') {
    if (!enabled || mode === 'none') return false;
    cancel();
    const p = typeof what === 'string' ? PRESETS[what] : null;
    if (typeof what === 'string' && !p) return false;
    if (mode === 'vibrate') return navigator.vibrate(p ? p.android : what);
    const n = p ? p.ios : Array.isArray(what) ? Math.ceil(what.length / 2) : 1;
    label.click();
    for (let i = 1; i < n; i++) timers.push(setTimeout(() => label.click(), i * iosGap));
    return true;
  }
  function setEnabled(v) {
    enabled = !!v;
    try { localStorage.setItem(KEY, enabled ? '1' : '0'); } catch (e) {}
    if (!enabled) cancel();
  }
  return {
    play, cancel, setEnabled, presets: PRESETS,
    get enabled() { return enabled; }, get mode() { return mode; },
    get iosGap() { return iosGap; }, set iosGap(ms) { iosGap = Math.max(20, +ms || 70); },
  };
})();

/* ================================================================
   Sound – szintetizált, mély „puttyos” hanghatások (Web Audio)
   Nincs hangfájl, teljesen offline. Minden hang: lefelé hajló szinusz
   + rövid, szűrt zajlöket (filcen koppanó kő/agyag érzet).
   ================================================================ */
const Sound = (() => {
  const KEY_ON = 'sound-enabled', KEY_VOL = 'sound-volume';
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, out = null, noiseBuf = null;
  let enabled = true, volume = 0.8;
  try {
    enabled = localStorage.getItem(KEY_ON) !== '0';
    const v = parseFloat(localStorage.getItem(KEY_VOL)); if (!isNaN(v)) volume = v;
  } catch (e) {}

  // iOS: „ambient” = tiszteli a néma kapcsolót és nem állítja le a háttérzenét
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}

  function init() {
    if (ctx || !AC) return ctx;
    ctx = new AC();
    out = ctx.createGain(); out.gain.value = volume;
    const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2600; tone.Q.value = 0.5;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.15;
    out.connect(tone); tone.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  function wake() {
    if (!init()) return null;
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    return ctx;
  }
  // Első érintésnél „feloldjuk” a hangot (iOS csak gesztusból enged)
  const unlock = () => {
    if (!wake()) return;
    const b = ctx.createBuffer(1, 1, ctx.sampleRate), s = ctx.createBufferSource();
    s.buffer = b; s.connect(ctx.destination); s.start(0);
  };
  ['pointerdown', 'touchend', 'keydown'].forEach(ev =>
    addEventListener(ev, unlock, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
  });

  const jit = (x, amt = 0.04) => x * (1 + (Math.random() - 0.5) * 2 * amt);

  function env(g, t, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }

  // Alap építőelem: mély, tompa koppanás
  function thud(t, f, o = {}) {
    const { decay = 0.22, drop = 1.7, gain = 0.9, body = 0.3,
            noiseCut = 900, noiseGain = 0.22, dest = out } = o;
    f = jit(f); const g0 = jit(gain, 0.08);

    const g = ctx.createGain(); env(g, t, g0, 0.004, decay); g.connect(dest);
    const s = ctx.createOscillator(); s.type = 'sine';
    s.frequency.setValueAtTime(f * drop, t);
    s.frequency.exponentialRampToValueAtTime(f, t + 0.05);
    s.connect(g); s.start(t); s.stop(t + decay + 0.05);

    if (body > 0) {   // fás „test” egy oktávval feljebb, gyorsabban lecseng
      const gb = ctx.createGain(); env(gb, t, g0 * body, 0.003, decay * 0.35); gb.connect(dest);
      const b = ctx.createOscillator(); b.type = 'triangle';
      b.frequency.setValueAtTime(f * 2 * drop, t);
      b.frequency.exponentialRampToValueAtTime(f * 2.02, t + 0.03);
      b.connect(gb); b.start(t); b.stop(t + decay);
    }
    if (noiseGain > 0) { // érintkezési zaj
      const n = ctx.createBufferSource(); n.buffer = noiseBuf;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = jit(noiseCut, 0.1); lp.Q.value = 0.8;
      const gn = ctx.createGain(); env(gn, t, g0 * noiseGain, 0.002, 0.035);
      n.connect(lp); lp.connect(gn); gn.connect(dest);
      n.start(t, Math.random() * 0.8); n.stop(t + 0.07);
    }
  }

  // Lágy, zengő alap a győzelemhez/vereséghez
  function pad(t, freqs, dur, gain = 0.18) {
    for (const f of freqs) for (const det of [-4, 4]) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = det;
      const g = ctx.createGain(); env(g, t, gain / freqs.length, 0.09, dur);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.2);
    }
  }

  // Szűrt zajsöprés (kövek összesöprése)
  function sweep(t, dur, from, peak, to, gain = 0.2) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(from, t);
    bp.frequency.exponentialRampToValueAtTime(peak, t + dur * 0.4);
    bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(bp); bp.connect(g); g.connect(out); n.start(t); n.stop(t + dur + 0.05);
  }

  const SFX = {
    placeX: t => thud(t, 112, { decay: 0.22, noiseCut: 1000 }),
    placeO: t => thud(t, 94,  { decay: 0.28, drop: 1.5, noiseCut: 650, body: 0.22 }),
    select: t => thud(t, 190, { decay: 0.07, gain: 0.28, noiseGain: 0.15, body: 0.15 }),
    error:  t => { thud(t, 72, { decay: 0.12, noiseCut: 380, body: 0.1, gain: 0.8 });
                   thud(t + 0.1, 66, { decay: 0.16, noiseCut: 340, body: 0.1, gain: 0.7 }); },
    threat: t => { thud(t, 64, { decay: 0.2, drop: 1.4, noiseGain: 0.08, body: 0.05, gain: 0.75 });
                   thud(t + 0.17, 58, { decay: 0.3, drop: 1.4, noiseGain: 0.06, body: 0.05, gain: 0.55 }); },
    undo:   t => { sweep(t, 0.14, 900, 500, 260, 0.12);
                   thud(t + 0.09, 150, { decay: 0.09, gain: 0.45, noiseGain: 0.1 }); },
    win:    t => { [98, 131, 165, 196].forEach((f, i) =>
                     thud(t + i * 0.11, f, { decay: i === 3 ? 0.55 : 0.25, gain: 0.8, body: 0.35 }));
                   pad(t + 0.33, [98, 147, 196, 247], 1.6, 0.22); },
    lose:   t => { [147, 123, 98, 73].forEach((f, i) =>
                     thud(t + i * 0.16, f, { decay: i === 3 ? 0.7 : 0.25, gain: 0.75, drop: 1.4, body: 0.2 }));
                   pad(t + 0.48, [73, 110, 139], 1.4, 0.16); },
    draw:   t => { thud(t, 110, { decay: 0.25 }); thud(t + 0.18, 110, { decay: 0.35, gain: 0.7 }); },
    newGame:t => { sweep(t, 0.42, 250, 1100, 300, 0.18);
                   for (let i = 0; i < 7; i++)
                     thud(t + 0.03 + Math.random() * 0.3, 120 + Math.random() * 90,
                          { decay: 0.06, gain: 0.18 + Math.random() * 0.15, noiseGain: 0.3, body: 0.4 }); },
  };

  function play(name, delay = 0) {
    if (!enabled || !SFX[name] || !wake()) return false;
    SFX[name](ctx.currentTime + 0.005 + delay);
    return true;
  }
  return {
    play, list: Object.keys(SFX),
    get enabled() { return enabled; },
    setEnabled(v) { enabled = !!v; try { localStorage.setItem(KEY_ON, enabled ? '1' : '0'); } catch (e) {} },
    get volume() { return volume; },
    setVolume(v) { volume = Math.min(1, Math.max(0, +v)); if (out) out.gain.value = volume;
                   try { localStorage.setItem(KEY_VOL, String(volume)); } catch (e) {} },
    get state() { return ctx ? ctx.state : 'nincs'; },
    supported: !!AC,
  };
})();

/* ================================================================
   FX – játékesemény → hang + rezgés egy hívással
   ================================================================ */
const FX = (() => {
  const MAP = {
    placeX:  { haptic: 'move' },
    placeO:  { haptic: 'tap' },
    select:  { haptic: 'select' },
    error:   { haptic: 'error' },
    threat:  { haptic: 'warning' },
    undo:    { haptic: 'tap' },
    win:     { haptic: 'win' },
    lose:    { haptic: 'heavy' },
    draw:    { haptic: 'success' },
    newGame: { haptic: 'tap' },
  };
  function play(name, { delay = 0, haptic = true } = {}) {
    Sound.play(name, delay);
    if (haptic && MAP[name]) Haptics.play(MAP[name].haptic);
  }
  return { play, events: Object.keys(MAP) };
})();

/* ================================================================
   Tesztfelület
   ================================================================ */
const $ = s => document.querySelector(s);
function mark(el, v, txt) { el.textContent = txt ?? (v ? 'igen' : 'nem'); el.className = v ? 'ok' : 'bad'; }
function log(msg) {
  const ts = new Date().toLocaleTimeString('hu-HU');
  $('#log').textContent = ts + '  ' + msg + '\n' + $('#log').textContent;
}
mark($('#mode'), Haptics.mode !== 'none', Haptics.mode);
mark($('#wa'), Sound.supported);
const upd = () => mark($('#net'), navigator.onLine);
upd(); addEventListener('online', upd); addEventListener('offline', upd);
setInterval(() => mark($('#ctxs'), Sound.state === 'running', Sound.state), 500);

const snd = $('#snd'), vol = $('#vol'), hap = $('#hap'), gap = $('#gap');
snd.checked = Sound.enabled; vol.value = Sound.volume; hap.checked = Haptics.enabled;
gap.value = Haptics.iosGap; $('#gapv').textContent = gap.value;
snd.addEventListener('change', () => Sound.setEnabled(snd.checked));
vol.addEventListener('input', () => Sound.setVolume(vol.value));
vol.addEventListener('change', () => FX.play('placeX', { haptic: false }));
hap.addEventListener('change', () => Haptics.setEnabled(hap.checked));
gap.addEventListener('input', () => { Haptics.iosGap = gap.value; $('#gapv').textContent = gap.value; });

const LABELS = { placeX:'X lerakása', placeO:'O lerakása', select:'Kijelölés', error:'Foglalt mező',
  threat:'Fenyegetés', undo:'Visszavonás', win:'Győzelem', lose:'Vereség', draw:'Döntetlen', newGame:'Új játék' };
for (const name of FX.events) {
  const b = document.createElement('button');
  b.innerHTML = `${LABELS[name]}<small>${name}</small>`;
  b.addEventListener('click', () => { FX.play(name); log(name); });
  $('#fxgrid').append(b);
}

/* ---------- Mini amőba ---------- */
const N = 7, WIN = 4, DIRS = [[1,0],[0,1],[1,1],[1,-1]];
let board, turn, hist, over, aiTimer = null;
const boardEl = $('#board'), statusEl = $('#status'), aiEl = $('#ai');

function line(i, who) {
  const x0 = i % N, y0 = (i / N) | 0; let best = [i];
  for (const [dx, dy] of DIRS) {
    const cells = [i];
    for (const s of [1, -1]) {
      let x = x0 + dx * s, y = y0 + dy * s;
      while (x >= 0 && y >= 0 && x < N && y < N && board[y * N + x] === who) { cells.push(y * N + x); x += dx * s; y += dy * s; }
    }
    if (cells.length > best.length) best = cells;
  }
  return best;
}

function render(winCells = [], popIdx = -1) {
  boardEl.innerHTML = '';
  const last = hist[hist.length - 1];
  board.forEach((v, i) => {
    const c = document.createElement('div');
    c.className = 'c' + (v ? ' ' + v : '') + (i === last ? ' last' : '') +
                  (winCells.includes(i) ? ' w' : '') + (i === popIdx ? ' pop' : '');
    c.textContent = v;
    c.addEventListener('pointerdown', e => { e.preventDefault(); onCell(i); });
    boardEl.append(c);
  });
  if (!over) statusEl.textContent = (aiEl.checked && turn === 'O') ? 'A gép gondolkodik…' : `${turn} következik`;
}

function newGame(sound = true) {
  clearTimeout(aiTimer); aiTimer = null;
  board = Array(N * N).fill(''); turn = 'X'; hist = []; over = false;
  render();
  if (sound) { FX.play('newGame'); log('új játék'); }
}

function place(i) {
  const who = turn; board[i] = who; hist.push(i);
  const ln = line(i, who);
  if (ln.length >= WIN) {
    over = true;
    const ev = (aiEl.checked && who === 'O') ? 'lose' : 'win';
    FX.play(ev); log(`${who} nyert → ${ev}`);
    statusEl.textContent = `${who} nyert!`;
    render(ln, i); return;
  }
  FX.play(who === 'X' ? 'placeX' : 'placeO');
  if (board.every(Boolean)) {
    over = true; Sound.play('draw', 0.15); log('döntetlen');
    statusEl.textContent = 'Döntetlen'; render([], i); return;
  }
  if (ln.length === WIN - 1) { Sound.play('threat', 0.12); log(`${who}: fenyegetés`); }
  turn = who === 'X' ? 'O' : 'X';
  render([], i);
}

function onCell(i) {
  if (over) { FX.play('error'); return; }
  if (aiEl.checked && turn === 'O') return;
  if (board[i]) { FX.play('error'); log('foglalt mező'); return; }
  place(i);
  if (aiEl.checked && !over && turn === 'O') aiTimer = setTimeout(aiMove, 450 + Math.random() * 300);
}

function aiMove() {
  aiTimer = null;
  let best = -1, bestScore = -Infinity;
  board.forEach((v, i) => {
    if (v) return;
    board[i] = 'O'; const own = line(i, 'O').length;
    board[i] = 'X'; const blk = line(i, 'X').length;
    board[i] = '';
    const x = i % N, y = (i / N) | 0;
    const center = -Math.hypot(x - 3, y - 3) * 0.1;
    const score = (own >= WIN ? 1000 : own * 10) + (blk >= WIN ? 500 : blk * 8) + center + Math.random();
    if (score > bestScore) { bestScore = score; best = i; }
  });
  if (best >= 0) place(best);
}

$('#new').addEventListener('click', () => newGame());
$('#undo').addEventListener('click', () => {
  clearTimeout(aiTimer); aiTimer = null;
  const steps = aiEl.checked ? (turn === 'X' ? 2 : 1) : 1;
  if (hist.length < steps) { FX.play('error'); return; }
  for (let s = 0; s < steps; s++) board[hist.pop()] = '';
  turn = aiEl.checked ? 'X' : (turn === 'X' ? 'O' : 'X');
  over = false; FX.play('undo'); log('visszavonás'); render();
});
aiEl.addEventListener('change', () => newGame(false));

newGame(false);
</script>
</body>
</html>
