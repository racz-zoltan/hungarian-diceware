html,body{margin:0}
:root{
  color-scheme: dark;
  --page:#060a17; --text:#e2e8f0; --muted:#94a3b8; --border:rgba(148,163,184,.16); --surface:rgba(255,255,255,.04);
  --blue:#22d3ee; --red:#fb7185; --gold:#fbbf24; --violet:#a78bfa;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%; background:var(--page); color:var(--text)}
body{font-family:var(--f-body); font-size:15px; line-height:1.5;
  background:
    radial-gradient(900px 600px at 0% -10%, rgba(34,211,238,.13), transparent 60%),
    radial-gradient(800px 600px at 110% 110%, rgba(251,113,133,.13), transparent 60%),
    linear-gradient(160deg, #121b35 0%, #0a0f1f 55%, #060a17 100%) fixed;
  min-height:100vh; min-height:100dvh}
.page{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
  padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}
.head{text-align:center}
.head h1{font-family:var(--f-display); font-weight:800; font-size:clamp(2rem, 5vw, 3rem); line-height:1; margin:0; letter-spacing:-.02em}
.head p{margin:8px 0 0; color:var(--muted)}
.games{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; width:min(560px, 100%)}
.game{display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 14px 18px; text-decoration:none; color:var(--text);
  border:1px solid var(--border); border-radius:20px;
  background:radial-gradient(120% 90% at 30% 0%, rgba(148,163,184,.10), transparent 60%), linear-gradient(160deg, #18233f 0%, #0d1428 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 18px 36px -18px rgba(0,0,0,.7);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease}
.game .art{width:min(140px, 100%); aspect-ratio:1; display:block}
.game .art svg{width:100%; height:100%; display:block; overflow:visible}
.game .name{font-family:var(--f-display); font-weight:700; font-size:clamp(1.05rem, 2.6vw, 1.3rem); line-height:1.15; text-align:center}
@media (hover:hover){
  .game:hover{transform:translateY(-3px); border-color:rgba(251,191,36,.55); box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(251,191,36,.25), 0 22px 40px -18px rgba(0,0,0,.8)}
}
.game:active{transform:translateY(0) scale(.98)}
.game:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
.gx{filter:drop-shadow(0 0 5px rgba(34,211,238,.55))}
.go{filter:drop-shadow(0 0 5px rgba(251,113,133,.5))}
.glowb{filter:drop-shadow(0 0 6px rgba(34,211,238,.45))}
.glowr{filter:drop-shadow(0 0 6px rgba(251,113,133,.45))}
.glowg{filter:drop-shadow(0 0 6px rgba(251,191,36,.45))}
.mv{filter:drop-shadow(0 0 3px rgba(34,211,238,.6))}
.glowv{filter:drop-shadow(0 0 6px rgba(167,139,250,.5))}
@media (max-width:380px){ .games{gap:10px} .game{padding:14px 8px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
